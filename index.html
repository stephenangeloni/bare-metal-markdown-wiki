<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Local Wiki</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a4be0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='4' width='20' height='16' rx='3'/%3E%3Cpath d='M6.5 15V9l2.5 2.5L11.5 9v6'/%3E%3Cpath d='M16 9v6M14 13l2 2 2-2'/%3E%3Cg fill='%231a4be0' stroke='none'%3E%3Ccircle cx='4.9' cy='6.9' r='.9'/%3E%3Ccircle cx='19.1' cy='6.9' r='.9'/%3E%3Ccircle cx='4.9' cy='17.1' r='.9'/%3E%3Ccircle cx='19.1' cy='17.1' r='.9'/%3E%3C/g%3E%3C/svg%3E">

  <!-- settings live in config.js, style tweaks in user.css — both survive upgrades -->
  <script src="config.js"></script>

  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/highlight.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="user.css">
  <script>try { const allowed = getComputedStyle(document.documentElement).colorScheme.split(' '); if (!allowed.includes('light') || !allowed.includes('dark')) document.documentElement.dataset.ownerTheme = ''; else { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.style.colorScheme = t; } } catch (e) {}</script>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="btn icon-btn" type="button" title="Menu" aria-label="Menu" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></button>
    <a href="#" class="brand" data-home><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M6.5 15V9l2.5 2.5L11.5 9v6"/><path d="M16 9v6M14 13l2 2 2-2"/><g fill="currentColor" stroke="none"><circle cx="4.9" cy="6.9" r=".9"/><circle cx="19.1" cy="6.9" r=".9"/><circle cx="4.9" cy="17.1" r=".9"/><circle cx="19.1" cy="17.1" r=".9"/></g></svg></span><span class="brand-name">Local Wiki</span></a>
    <div class="search-wrap">
      <input id="search" type="text" aria-label="Search pages" placeholder="Search pages…" autocomplete="off" spellcheck="false">
      <button id="clearSearch" class="clearbtn" type="button" title="Clear search">&times;</button>
      <kbd id="searchKey" class="search-kbd" aria-hidden="true">Ctrl K</kbd>
    </div>
    <div class="modegrp">
      <div id="mode" class="mode" title="Where pages come from: bundled snapshot (data.js) or a connected live folder"></div>
      <button id="themeBtn" class="btn icon-btn theme-btn" type="button" data-theme="system" title="Theme: System" aria-label="Theme: System"><svg class="i-system" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg><svg class="i-light" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></g></svg><svg class="i-dark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg></button>
      <button id="refresh" class="btn icon-btn hidden" type="button" title="Re-read the connected folder now (live mode)" aria-label="Re-read folder"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
      <button id="choose" class="btn hidden" type="button" title="Point the wiki at your markdown folder for live rendering (one-time, remembered).">Live render</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="tree" class="tree"></nav>
      <div id="tags" class="tags"></div>
    </aside>
    <div id="resizer" class="resizer" title="Drag to resize the sidebar"></div>
    <main id="content" class="content">
      <div class="main-col">
        <article id="page" class="page"></article>
        <section id="backlinks" class="backlinks"></section>
      </div>
      <nav id="tocRail" class="toc-rail hidden"></nav>
    </main>
  </div>
  <div id="searchResults" class="search-results hidden"></div>

  <!-- vendor (all local; downloaded once, never at runtime) -->
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/mdit-extras.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib-auto-render.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
