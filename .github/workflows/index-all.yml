name: index-all.html

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: for t in test-app.js test-render.js test-edit.js test-live.js test-bundle.js; do node "$t"; done
      - name: Bundle
        run: node bundle.js
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" index-all.html --clobber
