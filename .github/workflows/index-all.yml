name: index-all.html

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: for t in test-app.js test-render.js test-edit.js test-live.js test-bundle.js test-hook.js; do node "$t"; done
      - name: index-all.html is up to date
        run: |
          node bundle.js
          if [ -n "$(git status --porcelain -- index-all.html)" ]; then
            echo "::error file=index-all.html::index-all.html is out of date. Run 'git config core.hooksPath .githooks' once, then commit again."
            exit 1
          fi
